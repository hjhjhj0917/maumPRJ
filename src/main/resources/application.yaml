spring:
  config:
    import: optional:classpath:application-secret.yaml

  application:
    name: maum

  # 일기 이미지 업로드(최대 3장) 등 멀티파트 요청 용량 제한 - 기본값(파일당 1MB, 요청당 10MB)이 너무 작아서 상향
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB

  # Database Connection
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: ${secure.datasource.url}
    username: ${secure.datasource.username}
    password: ${secure.datasource.password}

  # MongoDB Connection
  mongodb:
    uri: ${secure.datasource.mongodb.uri}

  # Redis
  data:
    redis:
      host: ${secure.datasource.redis.host}
      port: ${secure.datasource.redis.port}
      password: ${secure.datasource.redis.password}

  # Mail
  mail:
    host: smtp.naver.com
    port: 465
    username: ${secure.mail.username}
    password: ${secure.mail.password}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          ssl:
            enable: true
            trust: smtp.naver.com

  # JPA
  jpa:
    generate-ddl: false
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
      cache:
        region:
          factory_class: org.hibernate.cache.jcache.internal.JCacheRegionFactory
    properties:
      jakarta:
        persistence:
          sharedCache:
            mode: ENABLE_SELECTIVE
      hibernate:
        cache:
          use_second_level_cache: true
          use_query_cache: true
        generate_statistics: true
        default_batch_fetch_size: 100
        format_sql: true
        use_sql_comments: true

server:
  port: 8080
  tomcat:
    # 요청 크기가 위 multipart 제한을 넘었을 때, Tomcat이 남은 바이트를 다 읽고 정상적으로
    # 413 에러를 내려줄 수 있도록 하는 한도 - 기본값(2MB)이 작아서 사진 여러 장 업로드 시
    # 에러 응답 없이 연결이 그냥 끊겨버림(ERR_CONNECTION_RESET) - 그래서 상향함
    max-swallow-size: 30MB

